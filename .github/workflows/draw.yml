name: "Draw Keymap"

# キーマップ(config/roBa.keymap)を保存するたびに、キー配置の図(keymap-drawer/roBa.png)を自動で作り直す。
# 作った図はこのワークフローが自分でコミットする。GitHubの仕様で、この自動コミットではビルドは動かない。
on:
  workflow_dispatch:
  push:
    paths:
      - "config/roBa.keymap"
      - "tools/draw_keymap.py"

concurrency:
  group: draw-keymap
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk
          pip install keymap-drawer==0.23.0 pillow

      - name: Draw keymap image
        run: python tools/draw_keymap.py

      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer/roBa.png
          if git diff --cached --quiet; then
            echo "図に変更なし"
            exit 0
          fi
          git commit -m "[Draw] update keymap image [skip ci]"
          git pull --rebase
          git push
